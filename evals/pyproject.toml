[project]
name = "the-saurus-evals"
version = "0.1.0"
description = "Evaluation suite for The Saurus pipeline and assistant"
requires-python = ">=3.13"
dependencies = [
    "ragas>=0.4.0",
    "deepeval>=3.9.0",
    "langfuse>=3.7.0",
    "openlit>=1.0.0",
    "openinference-instrumentation-google-genai>=0.1.0",
    "google-genai>=1.0.0",
    "anthropic>=0.94.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    # judge-gate runtime scoring service (M7-T1): thin FastAPI wrapper around
    # the existing GEval metric factories below, called over HTTP by the
    # pipeline service post-aggregation (see evals/scoring/judge_gate_service.py).
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "assistant/tests", "scoring/tests"]
asyncio_mode = "auto"
markers = [
    "eval: LLM evaluation tests (require API keys)",
    "regression: Regression tests against golden baseline",
    "safety: Safety and bias tests",
]
