[project]
name = "the-saurus"
version = "0.1.0"
description = "The Saurus — Literature review pipeline. Feed The Saurus your papers."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.94.0",
]

[tool.uv.workspace]
members = [
    "assistant-ws",
    "papers-mcp",
    "pipeline",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
