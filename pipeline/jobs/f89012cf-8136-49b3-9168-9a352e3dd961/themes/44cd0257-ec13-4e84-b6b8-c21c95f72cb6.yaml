  - page: 2
    paragraph: 2
- id: 1724f12c-7964-4937-86ac-05e9135a061f
  name: Executive Functions in ASD/ADHD
  description: The role of various executive functions, such as sustained attention,
    inhibitory control, and cognitive flexibility, in differentiating or confounding
    the diagnoses of ASD and ADHD.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 2
    paragraph: 4
