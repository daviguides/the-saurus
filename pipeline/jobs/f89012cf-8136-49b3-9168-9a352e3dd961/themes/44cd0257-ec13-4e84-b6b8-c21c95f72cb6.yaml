- id: 6c3f5c69-4c3c-4c38-a302-27ad0dd0b086
  name: Amphetamine-based Treatment Effects
  description: A discussion regarding the potentially paradoxical or undesirable effects
    of amphetamine-based treatment in individuals with ASD, highlighting a concern
    for dual diagnoses.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 1
    paragraph: 12
- id: 465a66cf-34c1-4c1b-9ac4-f2ad10e0e489
  name: Diagnostic Criteria and Nosography
  description: An examination of how different diagnostic manuals (DSM-4, ICD-10,
    DSM-5) define and differentiate ASD and ADHD, and their implications for diagnosing
    comorbidity.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 1
    paragraph: 15
