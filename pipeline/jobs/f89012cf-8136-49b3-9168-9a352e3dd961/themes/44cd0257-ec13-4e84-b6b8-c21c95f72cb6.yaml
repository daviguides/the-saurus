- id: 09e7c3e7-ba23-4981-8263-1a8cc70d81cf
  name: Attentional Impairment in ASD
  description: Exploration of the characteristic attentional profile, traits, or specific
    impairments observed in individuals with Autism Spectrum Disorder, positing them
    as inherent to ASD rather than indicative of comorbid ADHD.
