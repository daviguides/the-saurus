- id: e18f46ce-93fe-4ed4-8201-e8ee3a89df38
  name: Neurobiological Basis of Comorbidity
  description: Investigation into the distinct or shared neurofunctional and structural
    brain abnormalities underlying ASD, ADHD, and their comorbidity, including specific
    brain regions and neural networks.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
