    paragraph: 8
  - page: 5
    paragraph: 5
- id: 1349c874-e75c-498f-acc6-a5bd06ac7c36
  name: Prevalence and Variability of Findings
  description: An analysis of the reported prevalence rates of ADHD in ASD, highlighting
    the significant variability across studies and questioning the methodological
    approaches used to obtain these figures.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 1
