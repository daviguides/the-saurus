    paragraph: 5
- id: c2ae04e9-fc06-4dd4-93d9-1afe6ee1e2e8
  name: Neuropsychological Testing Limitations
  description: Concerns about the limitations of neuropsychological tests, particularly
    those solely assessing executive functions, in adequately discriminating between
    ASD, ADHD, and other neurodevelopmental conditions.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 2
    paragraph: 8
