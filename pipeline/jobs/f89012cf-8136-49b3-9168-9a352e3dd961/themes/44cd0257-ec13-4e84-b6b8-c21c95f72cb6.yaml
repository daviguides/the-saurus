- id: ee57523b-480b-4223-81cf-74a43e101f3b
  name: Psychomotor Agitation and Restlessness
  description: An analysis of whether agitation or restlessness observed in ASD patients
    is a symptom of ADHD's inhibitory deficit, a manifestation of emotional dysregulation,
    or a distinct trait related to cerebellar dysfunction in ASD.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
