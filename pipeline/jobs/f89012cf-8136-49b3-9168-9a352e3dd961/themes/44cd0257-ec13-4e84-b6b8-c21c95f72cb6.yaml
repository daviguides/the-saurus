- id: 94bdadd4-3553-4cf5-8330-b91fe3a6a8c4
  name: Sensory Processing in ASD
  description: The impact of sensory processing impairments, such as overreactivity
    or seeking behaviors, in ASD on attentional processes, memory, and social deficits.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 3
    paragraph: 5
  - page: 4
    paragraph: 3
- id: 4d110595-a1b1-4f31-a21f-70fff3ea7153
  name: Brain Imaging Techniques
  description: The use of various neuroimaging methods like fMRI, MRI, EEG, and MEG
    to identify structural and functional brain differences in ASD and ADHD, and in
    comorbid presentations.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
