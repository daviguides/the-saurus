- id: d522a656-01eb-47ec-9f64-99707f08b0ff
  name: Cerebellar Dysfunction in ASD
  description: The significance of cerebellar alterations, such as hypoplasia, in
    ASD and its proposed role in restlessness, learning processes, executive functions,
    and overall cognitive traits.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 3
    paragraph: 4
  - page: 5
    paragraph: 2
- id: f96fd4de-4521-4640-9c1c-c8bf5814eb2e
  name: Visuospatial Processing Abilities
  description: Comparison of visuospatial processing speed and local-global processing
    index between ASD, ADHD, and typically developing individuals as a means to better
    understand their neurocognitive specificities.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 3
    paragraph: 5
- id: d2ae3442-04ff-4bee-a522-439cc6e70652
  name: Emotional Dysregulation in ASD
  description: The high prevalence of disruptive mood dysregulation disorder and oppositional
    defiant disorder symptoms in ASD, linking externalizing behaviors and irritability
    to emotional dysregulation rather than solely to ADHD.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 3
    paragraph: 2
  - page: 4
    paragraph: 2
  - page: 4
    paragraph: 3
- id: 18a42366-f8b4-4f03-81ff-31bbc1efdade
  name: Overlapping vs. Discriminating Symptoms
  description: A debate on whether reported symptomatic overlaps between ASD and ADHD
    are true indicators of comorbidity or if severe ASD independently leads to symptoms
    that mimic ADHD.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 2
    paragraph: 8
  - page: 3
    paragraph: 5
