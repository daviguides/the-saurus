- id: 6121ce5c-d7d9-4262-acc5-6eb35bffa995
  name: Joint Attention Impairment
  description: The specific deficit in joint attention observed in ASD, characterized
    by difficulty in sharing focus with others, and its broader impact on social communication
    and development.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 1
