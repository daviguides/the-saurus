    paragraph: 2
- id: 207fb983-4139-4497-aab1-55fc159738be
  name: Hyperfocus in ASD
  description: The concept of 'hyperfocus' or heightened attentional abilities in
    ASD, especially on areas of interest, which can be mistakenly interpreted as ADHD
    inattention and its implications for diagnostic criteria.
  paper_id: 44cd0257-ec13-4e84-b6b8-c21c95f72cb6
  positions:
  - page: 4
    paragraph: 2
  - page: 4
