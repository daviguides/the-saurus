themes:
- id: 045b7f0f-b0ff-4fbd-8ddc-9d78b0d9253f
  name: ASD and ADHD Comorbidity
  description: The central theme investigating the co-occurrence of Autism Spectrum
    Disorder and Attention Deficit Hyperactivity Disorder, questioning its true significance
    and whether it represents distinct or overlapping conditions.
