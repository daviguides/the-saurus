  name: Physical Activity and Cognitive Health Across the Lifespan
  label: Physical Activity and Cognitive Health Across the Lifespan
  description: This theme encompasses the broad positive impacts of physical activity
    on brain health and cognitive functions, detailing these benefits across different
    populations and specific age groups, including children, adolescents, college
    students, middle-aged adults, and older adults.
