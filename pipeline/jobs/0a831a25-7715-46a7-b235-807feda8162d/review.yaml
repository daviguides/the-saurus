- theme_id: THEME 3
  label: Risks of Sedentary Behavior
  content: "In stark contrast to the numerous benefits of physical activity and its\
    \ role in fostering brain plasticity, sedentary lifestyles present significant\
    \ health and cognitive risks. A lack of physical activity is directly associated\
    \ with an elevated risk of cardiovascular diseases and earlier mortality [12](cite:12\
    \ \"p.1,\xA715\"). Beyond these physiological impacts, sedentary behavior is also\
    \ understood to negatively affect cognitive performance [13](cite:13 \"p.2,\xA7\
    4\"). These detrimental effects underscore the urgent need to promote active lifestyles,\
    \ not only for physical health but also as a critical strategy for maintaining\
    \ cognitive function and overall well-being, thereby mitigating the risks posed\
    \ by inactivity."
  claim_ids:
  - a38466cc-68f4-4365-ae67-14a9efd7b611
  - 44d1ac17-af63-4cfc-b648-1fb57f7481a9
  citation_refs:
