- id: 3d4c8855-3bdf-45a7-883e-359fb0cbc5e3
  theme_id: 75492e5f-fb37-4152-818f-97a8a3b964a6
  theme_name: Intervention Modalities and Efficacy
  text: "combined training that includes PA and cognitive training would be more e\uFB00\
    ective than single physical or single cognitive training."
  page: 2
  paragraph: 7
  deep: "Rieker et al. conducted a systematic review and multilevel meta-analysis\
    \ to investigate whether combined training that includes PA and cognitive training\
    \ would be more e\uFB00ective than single physical or single cognitive training.\
    \ Fifty studies were included in the meta-analysis involving 6,164 healthy older\
    \ adults and 783 e\uFB00ects sizes that were submitted to a three- level meta-analysis.\
    \ The results revealed a small advantage of combined training on cognitive outcomes\
    \ that was maintained at follow-up. Moreover, combined physical and cognitive\
    \ training produced some advantage over single cognitive training in improving\
    \ attention, executive functions, and processing speed. Improvements were highest\
    \ when the intervention was performed in a social context even though individual\
    \ training obtained similar results in balance as group training. The prevalence\
    \ of T2DM is a global health problem related to unhealthy diet and lack of exercise.\
    \ T2DM patients have a high risk of developing cognitive decline characterized\
    \ by long-term explicit memory and executive functions de\uFB01cits (Redondo et\
    \ al., 2015, 2016). Ni et al. in their systematic review and meta-analysis investigated\
    \ whether exercise alone could improve cognition in 738 older patients with T2DM.\
    \ The results indicated that exercise improved patient global cognition signi\uFB01\
    cantly and was not in\uFB02uenced by intervention modality, intervention duration,\
    \ or cognitive impairment. In conclusion, the studies included in this RT provide\
    \ \uFB01ndings on di\uFB00erent types of PA interventions as a useful way to change\
    \ brain and cognitive functioning across the lifespan. Our hope is that this RT\
    \ will inspire researchers to design and conduct new intervention studies aiming\
    \ at improving brain health, wellbeing, and cognition at all ages."
  summary: Rieker et al. investigated if combined physical and cognitive training
    is more effective than single modality training.
  source:
    paper_id: a57c9ea3-92d6-49f3-a285-33b45aac4d67
    page: 2
    paragraph: 7
