  text: "the e\uFB00ectiveness of PA on cognition and scholastic performance in children\
    \ is dependent on baseline brain organization."
  page: 2
  paragraph: 2
  deep: "modularity of brain networks at baseline was associated with greater improvements\
    \ in executive functions, cognition, and mathematics. This article is the \uFB01\
    rst to show how the e\uFB00ectiveness of PA on cognition and scholastic performance\
    \ in children is dependent on baseline brain organization. The cross-sectional\
    \ study by Feraco and Meneghetti investigated the relation between years of practicing\
    \ a sport and both, \uFB02uid reasoning and six soft skills. In total 1,115 individuals\
    \ (10\u201318 years) \uFB01lled in a questionnaire for assessing soft skills and\
    \ completed the Cattel test to assess \uFB02uid reasoning. The results con\uFB01\
    rmed the positive e\uFB00ect of PA on \uFB02uid reasoning and adolescents\u2019\
    \ soft skills."
  summary: The effectiveness of physical activity on children's cognition and scholastic
    performance is determined by their baseline brain organization.
  source:
    paper_id: a57c9ea3-92d6-49f3-a285-33b45aac4d67
    page: 2
