- id: 80cd7d67-21f2-4903-a8a0-7325834f6fae
  theme_id: da82b968-1402-4892-ba06-109f493969ba
  theme_name: Brain Plasticity and Neural Mechanisms
  text: "Cerebral blood \uFB02ow decreased in the most di\uFB03cult memory task after\
    \ the walking break condition. However, some aspects of working memory performance\
    \ improved, suggesting a neural e\uFB03ciency e\uFB00ect."
  page: 2
  paragraph: 4
  deep: "Chou et al. examined the sustained e\uFB00ects of acute resistance training\
    \ on inhibition in healthy middle-aged adults assigned to exercise or control\
    \ groups. The resistance exercise consisted of two sets of 7 exercises. The Stroop\
    \ test was administered before, after training, and 40 min post-training. The\
    \ \uFB01ndings suggest that a moderate intensity resistance training improves\
    \ executive functions. It is well-known that sedentary behavior has negative e\uFB00\
    ects for cognitive performance. Heiland et al. conducted a randomized crossover\
    \ study to investigate the e\uFB00ects of frequent, short PA breaks, during long\
    \ sitting periods on cognitive task-related activation of the prefrontal cortex.\
    \ In the study, 13 middle-aged adults underwent three-3- h seated conditions in\
    \ which they were interrupted every 30 min by di\uFB00erent 3-min break activity\
    \ (social interaction, walking, or simple resistance activity). Cerebral blood\
    \ \uFB02ow decreased in the most di\uFB03cult memory task after the walking break\
    \ condition. However, some aspects of working memory performance improved, suggesting\
    \ a neural e\uFB03ciency e\uFB00ect. Moreover, mood and alertness improved after\
    \ walking breaks. Therefore, short walking breaks have positive e\uFB00ect in\
    \ middle-aged adults to support performance on cognitively demanding tasks."
  summary: Despite decreased cerebral blood flow during a difficult memory task post-walking
    break, working memory improved, implying neural efficiency.
  source:
    paper_id: a57c9ea3-92d6-49f3-a285-33b45aac4d67
    page: 2
    paragraph: 4
- id: 57552da3-10c5-42ed-9607-471103d04a60
  theme_id: da82b968-1402-4892-ba06-109f493969ba
  theme_name: Brain Plasticity and Neural Mechanisms
  text: "6-month at- home aerobic exercise 3\u20134 days a week increased cardiovascular\
    \ \uFB01tness and maintained gray-matter structural integrity in brain areas showing\
    \ exercise-induced volume changes."
  page: 2
  paragraph: 6
  deep: "Polk et al. use a multimodal modeling approach for investigating the e\uFB00\
    ects of aerobic training on regional gray-matter structural integrity in older\
    \ adults. Results showed that 6-month at- home aerobic exercise 3\u20134 days\
    \ a week increased cardiovascular \uFB01tness and maintained gray-matter structural\
    \ integrity in brain areas showing exercise-induced volume changes. Thus, aerobic\
    \ \uFB01tness interventions might contribute to brain maintenance in sedentary\
    \ older adults."
  summary: Six months of regular aerobic exercise improved cardiovascular fitness
    and preserved gray-matter structural integrity in specific brain regions.
  source:
    paper_id: a57c9ea3-92d6-49f3-a285-33b45aac4d67
    page: 2
    paragraph: 6
