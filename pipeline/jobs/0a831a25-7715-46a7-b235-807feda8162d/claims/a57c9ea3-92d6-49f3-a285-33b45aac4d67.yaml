  theme_name: Brain Plasticity and Neural Mechanisms
  text: "Age and activity type seem to in\uFB02uence brain state, but underlying mechanisms\
    \ remain unclear."
  page: 1
  paragraph: 15
  deep: "This Research Topic (RT) focused on the e\uFB00ects of physical activity\
    \ (PA) on brain and cognitive functions across the lifespan. A growing body of\
    \ literature highlights how a physically active lifestyle is associated with reduced\
    \ risk of dementia, better cognitive functioning, physiological changes in the\
    \ brain and overall wellbeing. In this vein, studies on people with a sedentary\
    \ lifestyle highlight an increased risk of cardiovascular diseases and a higher\
    \ rate of early mortality. However, many studies found contrasting or inconclusive\
    \ results, depending on di\uFB00erent targeted population, tests, and methodologies.\
    \ Age and activity type seem to in\uFB02uence brain state, but underlying mechanisms\
    \ remain unclear. This RT addresses how the brain and cognitive functioning is\
    \ in\uFB02uenced by PA, as well as the psychological bene\uFB01ts of an active\
    \ lifestyle across the lifespan. It contains 9 contributions on the e\uFB00ect\
    \ of physical exercise on brain plasticity and cognitive functioning, including\
    \ original research articles (5), systematic reviews and meta-analyses (3), and\
    \ a brief research report (1). How can older adults counteract age-related declines\
    \ and lead longer, healthier, and fuller working lives? Across the lifespan, the\
    \ brain exhibits notable plasticity and adapts to environmental changes via modifying\
    \ brain function and neural connectivity (Goh and Park, 2009; Park and Reuter-Lorenz,\
    \ 2009; Reuter-Lorenz and Park, 2014). PA, cognitive training, and social engagement\
    \ are major intervention approaches to improve brain health and cognitive functioning\
    \ across the lifespan (Hillman et al., 2014; Ballesteros et al., 2015; Donnelly\
    \ et al., 2016; Kramer and Colcombe, 2018; Ballesteros, 2022). A great deal of\
    \ research supports that PA protects against age-related cognitive declines enhancing\
    \ executive functions and memory (H\xF6tting and R\xF6der, 2013; Voelcker- Rehage\
    \ and Niemann, 2013). This RT aims to provide a current picture of the state of\
    \ the art on the e\uFB00ect of PA interventions on brain and cognition across\
    \ the lifespan in healthy individuals and patients with type 2 diabetes mellitus\
    \ (T2DM)."
  summary: Age and activity type appear to affect brain state, but the underlying
    mechanisms are not yet clear.
  source:
    paper_id: a57c9ea3-92d6-49f3-a285-33b45aac4d67
    page: 1
    paragraph: 15
