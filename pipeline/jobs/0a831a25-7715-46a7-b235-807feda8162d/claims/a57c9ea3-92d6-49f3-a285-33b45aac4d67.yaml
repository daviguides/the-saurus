- id: 2f450bd4-417c-4c66-8fa7-cc9c2bca67ae
  theme_id: 186c0b70-e0f4-466a-abbc-ae2ce68336bb
  theme_name: General Effects of Physical Activity
  text: "the studies included in this RT provide \uFB01ndings on di\uFB00erent types\
    \ of PA interventions as a useful way to change brain and cognitive functioning\
    \ across the lifespan."
  page: 2
  paragraph: 7
  deep: "The prevalence of T2DM is a global health problem related to unhealthy diet\
    \ and lack of exercise. T2DM patients have a high risk of developing cognitive\
    \ decline characterized by long-term explicit memory and executive functions de\uFB01\
    cits (Redondo et al., 2015, 2016). Ni et al. in their systematic review and meta-analysis\
    \ investigated whether exercise alone could improve cognition in 738 older patients\
    \ with T2DM. The results indicated that exercise improved patient global cognition\
    \ signi\uFB01cantly and was not in\uFB02uenced by intervention modality, intervention\
    \ duration, or cognitive impairment. In conclusion, the studies included in this\
    \ RT provide \uFB01ndings on di\uFB00erent types of PA interventions as a useful\
    \ way to change brain and cognitive functioning across the lifespan. Our hope\
    \ is that this RT will inspire researchers to design and conduct new intervention\
    \ studies aiming at improving brain health, wellbeing, and cognition at all ages."
  summary: The Research Topic's studies demonstrate that various physical activity
    interventions can beneficially alter brain and cognitive functioning throughout
    life.
  source:
    paper_id: a57c9ea3-92d6-49f3-a285-33b45aac4d67
    page: 2
    paragraph: 7
