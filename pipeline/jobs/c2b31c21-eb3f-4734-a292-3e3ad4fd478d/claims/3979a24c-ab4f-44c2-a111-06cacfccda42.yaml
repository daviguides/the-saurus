  text: In the training but not in the control group, higher modularity of brain networks
    at baseline was associated with greater improvements in executive functions, cognition,
    and mathematics.
  page: 2
  paragraph: 2
  deep: "Ballesteros et al. Editorial: PE in Brain and Cognition modularity of brain\
    \ networks at baseline was associated with greater improvements in executive functions,\
    \ cognition, and mathematics. This article is the \uFB01rst to show how the e\uFB00\
    ectiveness of PA on cognition and scholastic performance in children is dependent\
    \ on baseline brain organization. The cross-sectional study by Feraco and Meneghetti\
    \ investigated the relation between years of practicing a sport and both, \uFB02\
    uid reasoning and six soft skills. In total 1,115 individuals (10\u201318 years)\
    \ \uFB01lled in a questionnaire for assessing soft skills and completed the Cattel\
    \ test to assess \uFB02uid reasoning. The results con\uFB01rmed the positive e\uFB00\
    ect of PA on \uFB02uid reasoning and adolescents\u2019 soft skills."
  summary: Higher baseline brain network modularity predicted greater improvements
    in executive functions, cognition, and mathematics in children undergoing physical
    activity training.
  source:
