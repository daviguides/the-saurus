- id: 69614bc6-ffc5-421c-beca-38d35d1062d5
  theme_id: 99407291-11b2-4522-9ff8-4c2c344aeb3d
  theme_name: PA and Cognitive Function in College Students & Middle-Aged Adults
  text: The authors found that PA correlated with several tests of executive functions,
    especially inhibitory control.
  page: 2
  paragraph: 3
  deep: "Salas-G\xF3mez et al. investigated the association between PA with memory\
    \ and executive functions in a sample of 206 college students. PA was assessed\
    \ with the IPAQ- SF questionnaire. The authors found that PA correlated with several\
    \ tests of executive functions, especially inhibitory control. The practice of\
    \ PA improves the ability to inhibit automatic responses and to show mental \uFB02\
    exibility. Taking a neuroscience perspective, Do et al. used the quantitative\
    \ approach for coordinate-based activation likelihood estimation (ALE) meta-analysis\
    \ to \uFB01nd out possible di\uFB00erences in the neural mechanisms underlying\
    \ motor decision making of experts and novices. A total of 12 studies with 219\
    \ motor experts and 210 novices were included in ALE. Greater activation was found\
    \ for novices compared to experts in the bilateral occipital lobe, left posterior\
    \ cerebellar lobe, and left middle temporal gyrus. The results suggest that long-term\
    \ motor training leads to functional reorganization of the brain that is associated\
    \ with neural e\uFB03ciency in athletes."
  summary: Physical activity correlated with various executive functions, particularly
    inhibitory control, in college students.
  source:
    paper_id: 3979a24c-ab4f-44c2-a111-06cacfccda42
    page: 2
    paragraph: 3
