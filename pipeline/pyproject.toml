[project]
name = "pipeline"
version = "0.1.0"
description = "The Saurus - Literature Review Pipeline"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-genai>=1.0.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "agno>=2.5.10",
    "qdrant-client>=1.12.0",
    "python-dotenv>=1.2.2",
    "restate-sdk>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests for individual functions",
    "integration: Integration tests for component interaction",
    "property: Property-based tests for invariants",
    "slow: Tests that take significant time to run",
]

[dependency-groups]
dev = [
    "hypothesis>=6.90.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "reportlab>=4.4.10",
    "ruff>=0.15.10",
]
