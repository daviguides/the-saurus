[project]
name = "pipeline"
version = "0.1.0"
description = "The Saurus - Literature Review Pipeline"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-genai>=1.0.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "agno>=2.5.10",
    "qdrant-client>=1.12.0",
    "python-dotenv>=1.2.2",
    "restate-sdk>=0.17.0",
    "tiktoken>=0.13.0",
    # guardrails-ai: value-level validation framework (M4 §5.1). The Guardrails
    # Hub "provenance" validators (provenance_embeddings/provenance_llm) are
    # NOT installed here — they require a user-provisioned Hub API token
    # (`guardrails hub install` returns 401 Unauthorized without one). M4's
    # claim_id validator is a hand-written Python validator function needing
    # only this core package, not a Hub install.
    "guardrails-ai>=0.10.2",
    # sentence-transformers: DeBERTa-v3 MNLI cross-encoder, GO verdict from
    # M1-T5 spike (spikes/local_model_viability.md §1).
    "sentence-transformers>=5.6.1",
    # spacy==3.8.13 pinned: GO verdict from M1-T5 spike (§2); pinned exact
    # because spacy>=3.8.14 dropped cp314 wheels (confirmed live during
    # implementation — 3.8.13 is the last version with a Python 3.14 wheel).
    "spacy==3.8.13",
    "en-core-web-sm",
    # AlignScore intentionally NOT added: NO-GO verdict from M1-T5 spike (§3)
    # — peak RSS 3.2-3.9GB vs the pod's 1Gi memory limit, Python 3.14 install
    # blocked (torch pin ceiling cp311), override path confirmed broken
    # (pytorch_lightning 2.x API break). See spikes/local_model_viability.md.
    # nemoguardrails: Colang topic-gate flow constraint (M3 §4.2, d-012). GO
    # verdict from this task's research.md spike — installs clean on Python
    # 3.13/3.14 (no torch/langchain), pure flow-gate runs with models: [] and
    # zero LLM calls via process_events_async (generate_events_async is broken
    # in 0.23.0 for Colang 2.x — see research.md Finding 3).
    "nemoguardrails>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests for individual functions",
    "integration: Integration tests for component interaction",
    "property: Property-based tests for invariants",
    "slow: Tests that take significant time to run",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "hypothesis>=6.90.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "reportlab>=4.4.10",
    "ruff>=0.15.10",
]
