name: Eval Regression

on:
  pull_request:
    paths:
      - 'pipeline/pipeline/agents/prompts/**'
      - 'pipeline/pipeline/agents/*.py'
      - 'assistant-ws/assistant_ws/agents/**'
      - 'evals/**'
  workflow_dispatch:

jobs:
  pipeline-evals:
    name: Pipeline Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install eval dependencies
        run: cd evals && uv sync

      - name: Run pipeline evals
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          USE_GEMINI_MODEL: "1"
        run: cd evals && uv run deepeval test run pipeline/tests/ -v

      - name: Run safety evals
        if: always()
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          USE_GEMINI_MODEL: "1"
        run: cd evals && uv run deepeval test run pipeline/tests/test_safety.py -v

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/.deepeval/
