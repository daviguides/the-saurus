[project]
name = "papers-mcp"
version = "0.1.0"
description = "The Saurus Papers RAG - MCP Server"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0.0",
    "qdrant-client>=1.12.0",
    "agno>=2.5.10",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100
