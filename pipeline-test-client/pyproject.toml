[project]
name = "pipeline-test-client"
version = "0.1.0"
description = "CLI tool for testing The Saurus pipeline API"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
]

[project.scripts]
pipeline-test = "pipeline_test_client.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_test_client"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
