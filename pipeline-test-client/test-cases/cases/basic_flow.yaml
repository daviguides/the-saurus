name: Basic Pipeline Flow
description: Upload a single PDF and verify the pipeline produces a review
timeout_seconds: 300

files:
  - path: papers/exercise_cognitive_function_brain.pdf

steps:
  - action: upload
  - action: wait_complete
    expect_status: completed
  - action: check_papers
    expect_paper_count: 1
    expect_theme_count_min: 3
    expect_claim_count_min: 5
  - action: check_review
    expect_review_sections_min: 3
    expect_review_has_citations: true
