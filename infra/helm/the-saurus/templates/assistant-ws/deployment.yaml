apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-assistant-ws
  labels:
    app.kubernetes.io/name: assistant-ws
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.assistantWs.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant-ws
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant-ws
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: assistant-ws
          image: "{{ .Values.assistantWs.image.repository }}:{{ .Values.assistantWs.image.tag }}"
          imagePullPolicy: {{ .Values.assistantWs.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: REDIS_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: REDIS_PASSWORD
            - name: PIPELINE_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: PIPELINE_LLM_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.assistantWs.resources | nindent 12 }}
