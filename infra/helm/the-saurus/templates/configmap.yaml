apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # Pipeline
  PIPELINE_LLM_MODEL: {{ .Values.pipeline.env.llmModel | quote }}
  PIPELINE_LLM_MAX_CONCURRENT: {{ .Values.pipeline.env.llmMaxConcurrent | quote }}

  # Qdrant
  QDRANT_URL: {{ .Values.config.qdrantUrl | quote }}

  # ClickHouse
  CLICKHOUSE_URL: {{ .Values.config.clickhouseUrl | quote }}

  # Langfuse
  LANGFUSE_WEB_URL: {{ .Values.config.langfuseWebUrl | quote }}
  LANGFUSE_WORKER_URL: {{ .Values.config.langfuseWorkerUrl | quote }}

  # S3
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}

  # Redis
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
