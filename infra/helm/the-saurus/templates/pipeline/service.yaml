  name: {{ .Release.Name }}-pipeline
  labels:
    app.kubernetes.io/name: pipeline
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: pipeline
    app.kubernetes.io/instance: {{ .Release.Name }}
