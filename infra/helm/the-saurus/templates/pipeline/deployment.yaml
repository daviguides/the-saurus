apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pipeline
  labels:
    app.kubernetes.io/name: pipeline
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.pipeline.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pipeline
          image: "{{ .Values.pipeline.image.repository }}:{{ .Values.pipeline.image.tag }}"
          imagePullPolicy: {{ .Values.pipeline.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: PIPELINE_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: PIPELINE_LLM_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.pipeline.resources | nindent 12 }}
          volumeMounts:
            - name: jobs
              mountPath: /app/jobs
      volumes:
        - name: jobs
          emptyDir: {}
