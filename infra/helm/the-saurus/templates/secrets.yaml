apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  PIPELINE_LLM_API_KEY: {{ .Values.secrets.pipelineLlmApiKey | quote }}
  LANGFUSE_DATABASE_URL: {{ .Values.secrets.langfuseDatabaseUrl | quote }}
  LANGFUSE_ENCRYPTION_KEY: {{ .Values.secrets.langfuseEncryptionKey | quote }}
  LANGFUSE_SALT: {{ .Values.secrets.langfuseSalt | quote }}
  LANGFUSE_NEXTAUTH_SECRET: {{ .Values.secrets.langfuseNextAuthSecret | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.secrets.clickhousePassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | quote }}
