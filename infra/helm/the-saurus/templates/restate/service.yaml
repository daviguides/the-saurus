{{- if .Values.restate.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-restate-ingress
  labels:
    app.kubernetes.io/name: restate
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: ingress
      port: 8080
      targetPort: ingress
    - name: admin
      port: 9070
      targetPort: admin
  selector:
    app.kubernetes.io/name: restate
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
