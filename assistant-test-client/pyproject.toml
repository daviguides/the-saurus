[project]
name = "assistant-test-client"
version = "0.1.0"
description = "CLI tool for testing The Saurus conversational assistant"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "python-socketio[asyncio_client]>=5.12.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
]

[project.scripts]
assistant-test = "assistant_test_client.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_test_client"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
